  #   container_name: gocrm-web
  #   ports:
  #     - "8080:8080"
  #   restart: unless-stopped
  db:
    image: postgres:17-alpine
    container_name: react-starterkit-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Map .env values to standard PostgreSQL container parameters
      POSTGRES_DB: ${DB_NAME:-gocrm}
      POSTGRES_USER: ${DB_USER:-gocrm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gocrm-dev-password}
    ports:
      # Exposes PostgreSQL default port to host (localhost:5432)
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USER:-gocrm} -d ${DB_NAME:-gocrm}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
